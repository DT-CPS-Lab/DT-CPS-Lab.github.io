<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | DT&amp;CPS Lab</title>
  <link rel="icon" href="/logo/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #FFC904; --black: #000000; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black);
      color: #e9e9e9;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(5rem, 20vw, 11rem);
      color: var(--gold);
      line-height: 1;
      letter-spacing: 0.05em;
    }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; margin: 1rem 0 0.5rem; }
    p { font-size: 1.15rem; color: #b9b9b9; max-width: 30rem; margin-bottom: 2rem; }
    a.home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--gold);
      color: var(--black);
      font-weight: 700;
      text-decoration: none;
      padding: 0.8rem 1.6rem;
      border-radius: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.home:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 201, 4, 0.35); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has moved. Let's get you back to the lab.</p>
  <a class="home" href="/">&larr; Return Home</a>
</body>
</html>
